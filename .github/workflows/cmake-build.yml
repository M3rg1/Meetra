name: CMake-build

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build_and_compile:
    name: Build & compile on ${{ matrix.os }} with ${{ matrix.compiler }}.
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Release
      CXX: ${{ matrix.compiler }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

        include:
          - os: ubuntu-latest
            compiler: g++

          - os: macos-latest
            compiler: g++-14

          - os: windows-latest
            compiler: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update compiler
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install ${{ matrix.compiler }}

      - name: Build
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Compile
        run: cmake --build ${{github.workspace}}/build
